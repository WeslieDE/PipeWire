<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MixPipe</title>
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <svg class="brand-glyph" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="6" cy="12" r="3.2" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="18" cy="7" r="3.2" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="18" cy="17" r="3.2" stroke="currentColor" stroke-width="1.6"/>
        <path d="M9 12h3.5M14.5 8.3 12.5 12M14.5 15.7 12.5 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span class="brand-word">MixPipe</span>
    </div>

    <div class="topbar-status" id="statusPill" data-state="connected">
      <span class="status-dot"></span>
      <span class="status-label">PipeWire connected</span>
    </div>

    <div class="topbar-actions">
      <button class="icon-btn" type="button" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="1.6"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V19.5a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H4.5a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.55-1.1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H10a1.7 1.7 0 0 0 1-1.55V4.5a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V10a1.7 1.7 0 0 0 1.55 1h.1a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.55 1Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" type="button" aria-label="About" title="About MixPipe">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"/><path d="M12 11v5.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="8.1" r="1" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <main class="board">
    <section class="column" aria-labelledby="sourcesHead">
      <div class="column-head">
        <h2 id="sourcesHead">Sources</h2>
        <div class="add-dropdown" data-side="source">
          <button class="add-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            Input
          </button>
          <div class="add-menu" role="listbox" hidden></div>
        </div>
      </div>
      <div class="card-list" id="sourceList" data-side="source"></div>
    </section>

    <div class="canvas-wrap" id="canvasWrap">
      <svg class="canvas" id="linkCanvas" aria-hidden="true"></svg>
    </div>

    <section class="column" aria-labelledby="sinksHead">
      <div class="column-head">
        <h2 id="sinksHead">Destinations</h2>
        <div class="add-dropdown" data-side="sink">
          <button class="add-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            Output
          </button>
          <div class="add-menu" role="listbox" hidden></div>
        </div>
      </div>
      <div class="card-list" id="sinkList" data-side="sink"></div>
    </section>
  </main>

</div>

<template id="cardTemplate">
  <article class="card" tabindex="0">
    <div class="card-head">
      <span class="card-icon"></span>
      <div class="card-title">
        <span class="card-name"></span>
        <span class="card-tag" hidden>virtual</span>
      </div>
      <div class="card-menu">
        <button class="card-menu-btn" type="button" aria-label="More options" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="5.5" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="18.5" r="1.4" fill="currentColor"/></svg>
        </button>
        <div class="card-popover" role="menu" hidden></div>
      </div>
    </div>
    <div class="card-row">
      <button class="mute-btn" type="button" aria-pressed="false" aria-label="Mute">
        <svg class="icon-vol-on" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9.5v5h3.4L12 18V6l-4.6 3.5H4Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M16 9.2a4 4 0 0 1 0 5.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M18.4 7a7.4 7.4 0 0 1 0 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <svg class="icon-vol-off" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9.5v5h3.4L12 18V6l-4.6 3.5H4Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="m16.4 9.5 4 4M20.4 9.5l-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <input class="volume-slider" type="range" min="0" max="100" value="0" aria-label="Volume" />
      <span class="volume-value">0%</span>
    </div>
    <button class="connector-dot" type="button" aria-label="Drag to connect"></button>
  </article>
</template>

<script src="qwebchannel.js"></script>
<script src="qtbridge.js"></script>
<script src="app.js"></script>
</body>
</html>
